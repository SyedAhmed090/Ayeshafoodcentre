<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Counter orders board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#171717}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; display: flex; flex-direction: column; background: #F1F0EC; color: #171717; font-family: 'Inter', system-ui, sans-serif">
<div style="height: 88px; flex-shrink: 0; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E4E2DC; padding: 0 24px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.5px">Ayesha Food Centre</div>
<div style="font-size: 14px; font-weight: 500; color: #5E5E5E">Front desk · Orders</div>
</div>
<a href="CounterWalkin.dc.html" style="height: 60px; padding: 0 26px; border-radius: 16px; background: #171717; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
Walk-in order
</a>
</div>
<div style="flex-grow: 1; padding: 20px 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="height: 56px; border-radius: 14px; background: #E5ECFC; color: #1B3FA0; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 20px; font-weight: 700">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg>
<span style="flex-grow: 1">Check</span>
<span>1</span>
</div>
<div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E2DC; box-shadow: 0 6px 16px rgba(23,23,23,0.05); padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -1px">#48</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 22px; font-weight: 700">Rs 1,000</div>
</div>
<div style="font-size: 17px; font-weight: 500; line-height: 1.45; color: #3F3F3F">1 × Zinger Burger<br>1 × Loaded Fries + Drink</div>
<a href="CounterCheck.dc.html" style="height: 60px; border-radius: 14px; background: #2456D6; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 600">See payment</a>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="height: 56px; border-radius: 14px; background: #FBE6E3; color: #8E1A12; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 20px; font-weight: 700">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg>
<span style="flex-grow: 1">New</span>
<span>2</span>
</div>
<sc-for list="{{fresh}}" as="o" hint-placeholder-count="2">
<div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E2DC; box-shadow: 0 6px 16px rgba(23,23,23,0.05); padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -1px">{{o.no}}</div>
<div style="font-size: 17px; font-weight: 600">{{o.pay}}</div>
</div>
<div style="font-size: 17px; font-weight: 500; line-height: 1.45; color: #3F3F3F; white-space: pre-line">{{o.items}}</div>
<button style="height: 60px; border-radius: 14px; border: 0; background: #C8281E; color: #FFFFFF; font: inherit; font-size: 19px; font-weight: 600">Start cooking</button>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="height: 56px; border-radius: 14px; background: #FFF1CC; color: #5F4400; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 20px; font-weight: 700">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>
<span style="flex-grow: 1">Cooking</span>
<span>2</span>
</div>
<sc-for list="{{cooking}}" as="o" hint-placeholder-count="2">
<div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E2DC; box-shadow: 0 6px 16px rgba(23,23,23,0.05); padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -1px">{{o.no}}</div>
<div style="font-size: 17px; font-weight: 600">{{o.pay}}</div>
</div>
<div style="font-size: 17px; font-weight: 500; line-height: 1.45; color: #3F3F3F; white-space: pre-line">{{o.items}}</div>
<button style="height: 60px; border-radius: 14px; border: 0; background: #F2B01E; color: #241800; font: inherit; font-size: 19px; font-weight: 600">Food ready</button>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="height: 56px; border-radius: 14px; background: #E1F3E8; color: #17693A; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 20px; font-weight: 700">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
<span style="flex-grow: 1">Ready</span>
<span>2</span>
</div>
<div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E2DC; box-shadow: 0 6px 16px rgba(23,23,23,0.05); padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -1px">#45</div>
<div style="font-size: 17px; font-weight: 600">Cash Rs 900</div>
</div>
<div style="font-size: 17px; font-weight: 500; line-height: 1.45; color: #3F3F3F">2 × Chicken Burger<br>1 × Fries</div>
<a href="CounterRider.dc.html" style="height: 60px; border-radius: 14px; background: #1F7A45; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 19px; font-weight: 600">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h4l4 8M9 9H6M14 9l1-3h3"/></svg>
Pick rider
</a>
</div>
<div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E2DC; box-shadow: 0 6px 16px rgba(23,23,23,0.05); padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -1px">#44</div>
<div style="font-size: 17px; font-weight: 600; color: #5E5E5E">Walk-in</div>
</div>
<div style="font-size: 17px; font-weight: 500; line-height: 1.45; color: #3F3F3F">1 × Chicken Roll</div>
<button style="height: 60px; border-radius: 14px; border: 1.5px solid #1F7A45; background: #FFFFFF; color: #17693A; font: inherit; font-size: 19px; font-weight: 600">Given to customer</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
renderVals() {
return {
fresh: [
{ no: '#50', pay: 'Cash Rs 700', items: '1 × Double Zinger\n1 × Drink' },
{ no: '#49', pay: 'Walk-in', items: '2 × Beef Burger' }
],
cooking: [
{ no: '#47', pay: 'Paid', items: '1 × Family Deal' },
{ no: '#46', pay: 'Cash Rs 450', items: '1 × Zinger Burger' }
]
};
}
}
</script>
</body>
</html>
