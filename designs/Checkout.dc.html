<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customer checkout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#171717}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 1080px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 18px; background: #FFFFFF; color: #171717; font-family: 'Inter', system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Back to menu" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E4E2DC; color: #171717; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.4px">Your order</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{lines}}" as="line" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 14px; background: #F1F0EC; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #5E5E5E">Photo</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 15px; font-weight: 600; line-height: 1.2">{{line.name}}</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; font-weight: 700">{{line.price}}</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; background: #F1F0EC; border-radius: 14px; padding: 2px">
<button aria-label="One less" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #FFFFFF; color: #171717; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
</button>
<div style="width: 20px; text-align: center; font-size: 16px; font-weight: 700">{{line.qty}}</div>
<button aria-label="One more" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #171717; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="co-name" style="font-size: 13px; font-weight: 600; color: #3F3F3F">Your name</label>
<input id="co-name" type="text" placeholder="Name" style="height: 50px; box-sizing: border-box; border: 1px solid #CFCDC6; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="co-phone" style="font-size: 13px; font-weight: 600; color: #3F3F3F">Phone number</label>
<input id="co-phone" type="tel" placeholder="03XX XXXXXXX" style="height: 50px; box-sizing: border-box; border: 1px solid #CFCDC6; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="co-addr" style="font-size: 13px; font-weight: 600; color: #3F3F3F">Delivery address</label>
<input id="co-addr" type="text" placeholder="House, street, sector" style="height: 50px; box-sizing: border-box; border: 1px solid #CFCDC6; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; color: #3F3F3F">How will you pay?</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 68px; border-radius: 14px; border: 1px solid #CFCDC6; background: #FFFFFF; color: #171717; font: inherit; font-size: 15px; font-weight: 600; line-height: 1.25">Cash on delivery</button>
<button style="height: 68px; border-radius: 14px; border: 2px solid #171717; background: #F1F0EC; color: #171717; font: inherit; font-size: 15px; font-weight: 700; line-height: 1.25">JazzCash / Easypaisa</button>
</div>
</div>
<div style="background: #F1F0EC; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; background: #171717; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">1</div>
<div style="font-size: 15px; font-weight: 600">Send <span style="font-weight: 700; color: #A81F16">Rs 1,000</span> to this number</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #FFFFFF; border-radius: 12px; padding: 6px 6px 6px 14px">
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; font-weight: 700">[SHOP MERCHANT NUMBER]</div>
<button style="height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #171717; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600">Copy</button>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; background: #171717; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">2</div>
<div style="font-size: 15px; font-weight: 600">Upload the payment screenshot</div>
</div>
<button style="height: 72px; border-radius: 12px; border: 1.5px dashed #8A8780; background: #FFFFFF; color: #171717; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
Choose screenshot
</button>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #E4E2DC; padding-top: 14px">
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #5E5E5E"><span>Food</span><span>Rs 950</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #5E5E5E"><span>Delivery</span><span>Rs 50</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 16px; font-weight: 600">Total</span>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Rs 1,000</span>
</div>
<a href="Status.dc.html" style="height: 60px; border-radius: 16px; background: #C8281E; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">Place order</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
return { lines: [
{ name: 'Zinger Burger', price: 'Rs 450', qty: '1' },
{ name: 'Loaded Fries + Drink', price: 'Rs 500', qty: '1' }
] };
}
}
</script>
</body>
</html>
