<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Counter walk-in order</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#171717}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; display: flex; flex-direction: column; background: #F1F0EC; color: #171717; font-family: 'Inter', system-ui, sans-serif">
<div style="height: 88px; flex-shrink: 0; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E4E2DC; padding: 0 24px; display: flex; align-items: center; gap: 16px">
<a href="CounterOrders.dc.html" aria-label="Back to orders" style="width: 56px; height: 56px; border-radius: 16px; border: 1px solid #E4E2DC; color: #171717; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Walk-in order</div>
</div>
<div style="flex-grow: 1; padding: 24px; display: flex; gap: 24px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<button style="height: 60px; border-radius: 14px; border: 0; background: #171717; color: #FFFFFF; font: inherit; font-size: 19px; font-weight: 600">Burgers</button>
<button style="height: 60px; border-radius: 14px; border: 1px solid #E4E2DC; background: #FFFFFF; color: #171717; font: inherit; font-size: 19px; font-weight: 600">Rolls</button>
<button style="height: 60px; border-radius: 14px; border: 1px solid #E4E2DC; background: #FFFFFF; color: #171717; font: inherit; font-size: 19px; font-weight: 600">Fries</button>
<button style="height: 60px; border-radius: 14px; border: 1px solid #E4E2DC; background: #FFFFFF; color: #171717; font: inherit; font-size: 19px; font-weight: 600">Drinks</button>
</div>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="8">
<button style="border-radius: 18px; border: 1px solid #E4E2DC; background: #FFFFFF; box-shadow: 0 6px 16px rgba(23,23,23,0.05); color: #171717; font: inherit; padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: left">
<span style="flex-grow: 1; align-self: stretch; min-height: 140px; border-radius: 12px; background: #F1F0EC; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #5E5E5E">Food photo</span>
<span style="font-size: 17px; font-weight: 600; line-height: 1.15">{{item.name}}</span>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 22px; font-weight: 700">{{item.price}}</span>
</button>
</sc-for>
</div>
</div>
<div style="width: 360px; flex-shrink: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 22px; box-shadow: 0 6px 16px rgba(23,23,23,0.05); padding: 18px; display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 16px; font-weight: 600; color: #5E5E5E">This order</div>
<sc-for list="{{lines}}" as="line" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 14px; background: #F1F0EC; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #5E5E5E">Photo</div>
<div style="flex-grow: 1; font-size: 16px; font-weight: 600; line-height: 1.2">{{line.name}}</div>
<div style="display: flex; align-items: center; gap: 6px; background: #F1F0EC; border-radius: 16px; padding: 3px">
<button aria-label="One less" style="width: 50px; height: 50px; border-radius: 13px; border: 0; background: #FFFFFF; color: #171717; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
</button>
<div style="width: 26px; text-align: center; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700">{{line.qty}}</div>
<button aria-label="One more" style="width: 50px; height: 50px; border-radius: 13px; border: 0; background: #171717; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>
</div>
</sc-for>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #E4E2DC; padding-top: 16px">
<div style="font-size: 16px; font-weight: 600; color: #5E5E5E">Take this much</div>
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 68px; font-weight: 700; line-height: 1; letter-spacing: -2px">Rs 1,250</div>
<a href="CounterOrders.dc.html" style="margin-top: 6px; height: 76px; border-radius: 16px; background: #1F7A45; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 22px; font-weight: 600">
<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l6 6L20 6"/></svg>
Cash taken
</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
renderVals() {
return {
items: [
{ name: 'Zinger Burger', price: '450' },
{ name: 'Chicken Burger', price: '350' },
{ name: 'Beef Burger', price: '400' },
{ name: 'Double Zinger', price: '650' },
{ name: 'Fish Burger', price: '400' },
{ name: 'Egg Burger', price: '250' },
{ name: 'Kids Burger', price: '200' },
{ name: 'Burger + Fries', price: '550' }
],
lines: [
{ name: 'Zinger Burger', qty: '2' },
{ name: 'Chicken Burger', qty: '1' }
]
};
}
}
</script>
</body>
</html>
